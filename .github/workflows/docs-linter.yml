name: Docs Quality Gate

on:
  pull_request:
    branches: [main]
    paths: ['docs/**', '.markdownlint.json']
  push:
    branches: [main]

jobs:
  markdownlint:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Gate the authored thesis chapters; the pre-thesis seed
          # docs/proposal.md is a legacy artifact and is excluded.
          globs: |
            docs/**/*.md
            !docs/proposal.md
          config: '.markdownlint.json'
